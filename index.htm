<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8b8ff8" />
  <link rel="icon" href="/favicon.ico" />
  <title>MCBBS纪念版 · 备用页面</title>

  <style>
    :root {
      --bg-1: #f7f8ff;
      --bg-2: #eef4ff;
      --bg-3: #fff2f8;
      --text: #26304a;
      --muted: #71809f;
      --primary: #6f78f7;
      --primary-2: #9d7cf8;
      --pink: #ff9bc4;
      --card: rgba(255, 255, 255, .70);
      --border: rgba(255, 255, 255, .88);
      --shadow: 0 24px 80px rgba(83, 94, 167, .18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family:
        Inter, "SF Pro Display", "SF Pro Text", -apple-system,
        BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(161, 169, 255, .34), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(255, 179, 212, .34), transparent 28%),
        radial-gradient(circle at 78% 82%, rgba(138, 205, 255, .25), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 46%, var(--bg-3));
      display: grid;
      place-items: center;
      padding: 32px 20px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .48;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(120,130,230,.28) 0 1px, transparent 1.5px);
      background-size: 42px 42px, 70px 70px;
      background-position: 0 0, 24px 20px;
      mask-image: linear-gradient(to bottom, #000, rgba(0,0,0,.25));
    }

    .blob {
      position: fixed;
      border-radius: 999px;
      filter: blur(1px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .blob.one {
      width: 260px;
      height: 260px;
      top: -70px;
      left: -70px;
      background: linear-gradient(145deg, rgba(138,145,255,.28), rgba(188,163,255,.16));
    }

    .blob.two {
      width: 220px;
      height: 220px;
      right: -70px;
      bottom: -55px;
      background: linear-gradient(145deg, rgba(255,158,201,.25), rgba(146,205,255,.18));
      animation-delay: -3s;
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -14px, 0); }
    }

    .shell {
      width: min(960px, 100%);
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding: 0 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 30px rgba(111, 120, 247, .32);
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .08em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.9);
      color: #65708e;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #66c98f;
      box-shadow: 0 0 0 5px rgba(102,201,143,.12);
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 520px;
      padding: 64px;
      border-radius: 34px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
    }

    .card::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -150px;
      top: -180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(175,180,255,.30) 34%, rgba(255,170,213,.20) 62%, transparent 72%);
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .8;
    }

    .spark {
      position: absolute;
      color: rgba(112, 122, 241, .35);
      font-size: 18px;
      animation: twinkle 3.8s ease-in-out infinite;
    }

    .spark:nth-child(1) { left: 8%; top: 16%; }
    .spark:nth-child(2) { left: 88%; top: 34%; animation-delay: -1.4s; }
    .spark:nth-child(3) { left: 73%; top: 75%; animation-delay: -2.1s; }
    .spark:nth-child(4) { left: 14%; top: 82%; animation-delay: -.7s; }

    @keyframes twinkle {
      0%, 100% { opacity: .3; transform: scale(.85) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(10deg); }
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 650px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #7b67d8;
      background: rgba(133, 113, 232, .09);
      border: 1px solid rgba(133, 113, 232, .12);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .06em;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 900;
    }

    .gradient-text {
      background: linear-gradient(100deg, #626cf0 10%, #8f71ed 48%, #ee8eb8 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin: 24px 0 0;
      max-width: 610px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.9;
    }

    .lead strong {
      color: #4d5877;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .btn {
      min-width: 190px;
      height: 54px;
      padding: 0 22px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-decoration: none;
      font-weight: 800;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #6973f4, #8f78f2);
      box-shadow: 0 15px 32px rgba(111, 120, 247, .30);
    }

    .btn-primary:hover {
      box-shadow: 0 20px 38px rgba(111, 120, 247, .38);
    }

    .btn-secondary {
      color: #616d91;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(137,145,205,.18);
      box-shadow: 0 12px 26px rgba(95,105,170,.10);
    }

    .arrow {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      font-size: 16px;
    }

    .btn-secondary .arrow {
      background: rgba(110,119,220,.08);
    }

    .note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 34px;
      color: #8a94ad;
      font-size: 13px;
      line-height: 1.7;
    }

    .note-icon {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #826ce2;
      background: rgba(130,108,226,.10);
      font-weight: 900;
    }

    footer {
      margin-top: 18px;
      padding: 0 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #9aa3ba;
      font-size: 12px;
    }

    footer strong {
      color: #7f89a4;
    }

    .anime-orb {
      position: absolute;
      right: 58px;
      bottom: 44px;
      width: 155px;
      aspect-ratio: 1;
      border-radius: 50%;
      z-index: 1;
      opacity: .9;
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.98) 0 8%, transparent 9%),
        radial-gradient(circle at 40% 48%, #6a72ed 0 3%, transparent 3.8%),
        radial-gradient(circle at 60% 48%, #6a72ed 0 3%, transparent 3.8%),
        radial-gradient(ellipse at 50% 61%, rgba(255,153,193,.6) 0 4%, transparent 4.8%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.94) 0 49%, transparent 50%),
        linear-gradient(135deg, #9fa7ff, #f3a6cf);
      box-shadow:
        0 22px 45px rgba(111, 120, 247, .18),
        inset 0 0 0 8px rgba(255,255,255,.40);
      transform: rotate(-4deg);
    }

    .anime-orb::before,
    .anime-orb::after {
      content: "";
      position: absolute;
      width: 62px;
      height: 74px;
      top: -14px;
      z-index: -1;
      background: linear-gradient(145deg, #aaa8ff, #ef9ac7);
      border-radius: 62% 38% 65% 35%;
    }

    .anime-orb::before {
      left: 2px;
      transform: rotate(-28deg);
    }

    .anime-orb::after {
      right: 2px;
      transform: scaleX(-1) rotate(-28deg);
    }

    @media (max-width: 760px) {
      body {
        padding: 22px 14px;
      }

      .topbar {
        align-items: flex-start;
      }

      .status {
        display: none;
      }

      .card {
        min-height: auto;
        padding: 40px 26px 130px;
        border-radius: 28px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .anime-orb {
        width: 112px;
        right: 24px;
        bottom: 22px;
      }

      footer {
        justify-content: center;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="blob one"></div>
  <div class="blob two"></div>

  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          MCBBS纪念版
          <small>MEMORIAL EDITION</small>
        </div>
      </div>
      <div class="status">备用页面正常运行</div>
    </div>

    <section class="card">
      <div class="sparkles" aria-hidden="true">
        <span class="spark">✦</span>
        <span class="spark">✧</span>
        <span class="spark">✦</span>
        <span class="spark">✧</span>
      </div>

      <div class="content">
        <div class="eyebrow">BACKUP PAGE · 备用入口</div>

        <h1>
          这里是 <span class="gradient-text">MCBBS纪念版</span><br />
          的备用页面。
        </h1>

        <p class="lead">
          当前页面仅作为备用访问入口。<br />
          请优先访问我们的主站：
          <strong>www.mcbbs.co</strong> 或 <strong>www.mcbbs.fun</strong>。
        </p>

        <div class="actions">
          <a class="btn btn-primary" href="https://www.mcbbs.co/" rel="noopener">
            <span>访问 mcbbs.co</span>
            <span class="arrow">→</span>
          </a>

          <a class="btn btn-secondary" href="https://www.mcbbs.fun/" rel="noopener">
            <span>访问 mcbbs.fun</span>
            <span class="arrow">→</span>
          </a>
        </div>

        <div class="note">
          <div class="note-icon">i</div>
          <div>
            若其中一个域名暂时无法访问，可以尝试另一个入口。
            本页面不承载论坛主要功能。
          </div>
        </div>
      </div>

      <div class="anime-orb" aria-hidden="true"></div>
    </section>

    <footer>
      <span>© 2024–现在 <strong>MCBBS Memorial Edition</strong></span>
      <span>Made for the community · 又见面啦。</span>
    </footer>
  </main>
</body>
</html>
