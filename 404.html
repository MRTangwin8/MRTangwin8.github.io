<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>正在跳转至 MCBBS 纪念版</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8vw;
            overflow: hidden;

            color: #ffffff;
            background: #0078d7;
            font-family:
                "Segoe UI",
                "Microsoft YaHei",
                Arial,
                sans-serif;
        }

        .screen {
            width: 100%;
            max-width: 1100px;
        }

        .face {
            margin-bottom: 24px;
            font-size: clamp(72px, 11vw, 150px);
            font-weight: 300;
            line-height: 1;
        }

        h1 {
            margin: 0 0 26px;
            font-size: clamp(25px, 3vw, 42px);
            font-weight: 400;
            line-height: 1.5;
        }

        .description {
            margin: 0 0 30px;
            font-size: clamp(17px, 1.7vw, 24px);
            line-height: 1.8;
        }

        .progress {
            font-size: clamp(16px, 1.5vw, 21px);
            line-height: 1.8;
        }

        .target {
            display: block;
            margin-top: 8px;
            overflow-wrap: anywhere;
            opacity: 0.85;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 14vh 9vw 8vh;
            }

            .face {
                margin-bottom: 18px;
            }

            h1 {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="screen">
        <div class="face">:(</div>

        <h1>
            您正在访问的是纪念版的备用域名
        </h1>

        <p class="description">
            接下来会为您跳转至正确域名，请稍候。
        </p>

        <div class="progress">
            <span id="countdown">3</span> 秒后自动跳转……

            <a id="targetLink" class="target" href="https://www.mcbbs.co/">
                https://www.mcbbs.co/
            </a>
        </div>
    </main>

    <script>
        (function () {
            "use strict";

            const mainOrigin = "https://www.mcbbs.co";

            /*
             * 支持：
             * /thread-123456-2-3.html
             *
             * 不符合该格式的路径统一跳转到首页。
             */
            const threadPathPattern = /^\/thread-\d+-\d+-\d+\.html$/i;

            const currentPath = window.location.pathname;
            let targetUrl = mainOrigin + "/";

            if (threadPathPattern.test(currentPath)) {
                targetUrl =
                    mainOrigin +
                    currentPath +
                    window.location.search +
                    window.location.hash;
            }

            const targetLink = document.getElementById("targetLink");
            const countdownElement = document.getElementById("countdown");

            targetLink.href = targetUrl;
            targetLink.textContent = targetUrl;

            let remainingSeconds = 3;

            const timer = window.setInterval(function () {
                remainingSeconds -= 1;
                countdownElement.textContent = String(remainingSeconds);

                if (remainingSeconds <= 0) {
                    window.clearInterval(timer);
                    window.location.replace(targetUrl);
                }
            }, 1000);
        })();
    </script>
</body>
</html>
